name: Build and Release CleanDesk

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build CleanDesk & Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build CleanDesk Widget (Release x64)
        run: |
          msbuild CleanDeskWidget.csproj /p:Configuration=Release /p:Platform=x64 /nologo

      - name: Build Windows Installer Setup
        run: |
          .\build_installer.bat

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanDesk-Setup
          path: release_build/CleanDesk-v1.0-Setup.exe

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_build/CleanDesk-v1.0-Setup.exe
          name: CleanDesk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
